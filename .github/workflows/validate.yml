name: Website Validation & Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Code & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate HTML structure
        run: |
          python3 -c "
          import html.parser
          class MyParser(html.parser.HTMLParser):
              pass
          parser = MyParser()
          with open('index.html') as f:
              parser.feed(f.read())
          print('index.html HTML parser check: OK')
          "

      - name: Secret and API Key Scanner
        run: |
          echo "Scanning for sensitive patterns..."
          ! grep -RInE --exclude-dir=.git '(OPENWEATHER_API_KEY[[:space:]]*=[[:space:]]*["\x27][0-9a-zA-Z]{16,}["\x27]|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|password[[:space:]]*=[[:space:]]*["\x27][^"\x27]{6,}["\x27])' .
          echo "Secret scan passed: zero leaked credentials."
